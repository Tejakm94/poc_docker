services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: ada_db
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-alten_123}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD:-alten_123}", "-Q", "SELECT 1"]
      interval: 15s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./ADA_backend
    container_name: ada_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME:-ada_db}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-alten_123}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:-changeme_secret}
      DB_RESTORE_API_KEY: ${DB_RESTORE_API_KEY:-1234567890}
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./ADA_frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_DB_RESTORE_API_KEY: ${VITE_DB_RESTORE_API_KEY:-1234567890}
    container_name: ada_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mssql_data:
